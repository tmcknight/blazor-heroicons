name: NuGet Publish

on:
  push:
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC token issuance (NuGet trusted publishing)
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
      - name: Pack
        run: dotnet pack src/Blazor.Heroicons/Blazor.Heroicons.csproj --no-build --configuration Release -o . -p:Version=${{ env.VERSION }}
      - name: NuGet login (exchange OIDC token for short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: tmcknight # nuget.org profile name
      - name: Publish package to NuGet
        run: dotnet nuget push *.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json" --skip-duplicate
